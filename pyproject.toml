[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ward-dm"
version = "0.1.0"
description = "A private table-side control surface for D&D Dungeon Masters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2",
]

[project.scripts]
ward = "ward.cli:main"
dmtui = "ward.cli:main"

[tool.setuptools]
packages = ["ward", "dmtui"]
py-modules = [
    "app",
    "battle",
    "campaigns",
    "ddb",
    "dm_screen",
    "encounter_store",
    "music",
    "modals",
    "openai_client",
    "persistence",
    "srd",
    "ward_backup",
    "widgets",
]

[tool.setuptools.package-data]
ward = ["py.typed", "music_config.json"]
dmtui = ["py.typed"]
